<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skill / Attribute / Resource Calculator</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 30px 15px;
            font-family: Arial, sans-serif;
            background: #111827;
            color: #f3f4f6;
        }

        .container {
            max-width: 800px;
            margin: auto;
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
        }

        .calculator {
            background: #1f2937;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .calculator h2 {
            margin-top: 0;
        }

        .skill h2 {
            color: #60a5fa;
        }

        .attribute h2 {
            color: #fbbf24;
        }

        .resource h2 {
            color: #34d399;
        }

        .inputs {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            color: #9ca3af;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #4b5563;
            border-radius: 6px;
            background: #111827;
            color: white;
            font-size: 16px;
        }

        input:focus {
            outline: 2px solid #60a5fa;
            border-color: transparent;
        }

        .result {
            margin-top: 20px;
            padding: 15px;
            background: #111827;
            border-radius: 8px;
        }

        .result-row {
            display: flex;
            justify-content: space-between;
            padding: 6px 0;
        }

        .total {
            border-top: 1px solid #374151;
            margin-top: 8px;
            padding-top: 12px;
            font-size: 22px;
            font-weight: bold;
        }

        .formula {
            color: #9ca3af;
            font-size: 14px;
            margin-top: 8px;
        }

        @media (max-width: 500px) {
            .inputs {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Level Cost Calculator</h1>

    <!-- Skills -->
    <div class="calculator skill">
        <h2>Skills — 5×</h2>

        <div class="inputs">
            <div>
                <label for="skillStart">Starting Level</label>
                <input type="number" id="skillStart" value="3" min="1">
            </div>

            <div>
                <label for="skillEnd">Ending Level</label>
                <input type="number" id="skillEnd" value="7" min="1">
            </div>
        </div>

        <div class="result">
            <div class="result-row">
                <span>Levels:</span>
                <span id="skillLevels">3 → 7</span>
            </div>

            <div class="result-row">
                <span>Multiplier:</span>
                <span>5×</span>
            </div>

            <div class="result-row total">
                <span>Total Cost:</span>
                <span id="skillTotal">100</span>
            </div>

            <div class="formula">
                Cost = 5 × sum of levels
            </div>
        </div>
    </div>


    <!-- Attributes -->
    <div class="calculator attribute">
        <h2>Attributes — 25×</h2>

        <div class="inputs">
            <div>
                <label for="attributeStart">Starting Level</label>
                <input type="number" id="attributeStart" value="3" min="1">
            </div>

            <div>
                <label for="attributeEnd">Ending Level</label>
                <input type="number" id="attributeEnd" value="7" min="1">
            </div>
        </div>

        <div class="result">
            <div class="result-row">
                <span>Levels:</span>
                <span id="attributeLevels">3 → 7</span>
            </div>

            <div class="result-row">
                <span>Multiplier:</span>
                <span>25×</span>
            </div>

            <div class="result-row total">
                <span>Total Cost:</span>
                <span id="attributeTotal">500</span>
            </div>

            <div class="formula">
                Cost = 25 × sum of levels
            </div>
        </div>
    </div>


    <!-- Resources -->
    <div class="calculator resource">
        <h2>Resources — 15×</h2>

        <div class="inputs">
            <div>
                <label for="resourceStart">Starting Level</label>
                <input type="number" id="resourceStart" value="3" min="1">
            </div>

            <div>
                <label for="resourceEnd">Ending Level</label>
                <input type="number" id="resourceEnd" value="7" min="1">
            </div>
        </div>

        <div class="result">
            <div class="result-row">
                <span>Levels:</span>
                <span id="resourceLevels">3 → 7</span>
            </div>

            <div class="result-row">
                <span>Multiplier:</span>
                <span>15×</span>
            </div>

            <div class="result-row total">
                <span>Total Cost:</span>
                <span id="resourceTotal">300</span>
            </div>

            <div class="formula">
                Cost = 15 × sum of levels
            </div>
        </div>
    </div>

</div>


<script>
    /*
        Calculates the sum of all levels from start to end.

        Example:
        3 → 7

        3 + 4 + 5 + 6 + 7 = 25
    */
    function sumLevels(start, end) {
        if (start > end) {
            [start, end] = [end, start];
        }

        const count = end - start + 1;

        return (count * (start + end)) / 2;
    }


    function calculate(startId, endId, levelsId, totalId, multiplier) {
        const start = Number(document.getElementById(startId).value);
        const end = Number(document.getElementById(endId).value);

        const levelsElement = document.getElementById(levelsId);
        const totalElement = document.getElementById(totalId);

        if (
            !Number.isFinite(start) ||
            !Number.isFinite(end) ||
            start < 1 ||
            end < 1
        ) {
            levelsElement.textContent = "Invalid";
            totalElement.textContent = "0";
            return;
        }

        const sum = sumLevels(start, end);
        const total = sum * multiplier;

        levelsElement.textContent = `${start} → ${end}`;
        totalElement.textContent = total.toLocaleString();
    }


    function calculateAll() {
        calculate(
            "skillStart",
            "skillEnd",
            "skillLevels",
            "skillTotal",
            5
        );

        calculate(
            "attributeStart",
            "attributeEnd",
            "attributeLevels",
            "attributeTotal",
            25
        );

        calculate(
            "resourceStart",
            "resourceEnd",
            "resourceLevels",
            "resourceTotal",
            15
        );
    }


    // Recalculate whenever an input changes
    document.querySelectorAll("input").forEach(input => {
        input.addEventListener("input", calculateAll);
    });


    // Initial calculation
    calculateAll();
</script>

</body>
</html>
